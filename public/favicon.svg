<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background hex/dark base -->
  <rect width="64" height="64" rx="14" fill="#070C1A" />
  <rect width="64" height="64" rx="14" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.3" />
  
  <!-- Neural Circuit Traces -->
  <path d="M14 32 H24 L32 20 H50" stroke="#00F0FF" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7" />
  <path d="M24 32 L32 44 H50" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7" />
  <path d="M32 20 V44" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="2 2" stroke-opacity="0.6" />
  
  <!-- Neural Nodes -->
  <circle cx="14" cy="32" r="3.5" fill="#00F0FF" filter="url(#neon)" />
  <circle cx="24" cy="32" r="3" fill="#60A5FA" />
  <circle cx="32" cy="20" r="4" fill="url(#glowGrad)" filter="url(#neon)" />
  <circle cx="32" cy="44" r="4" fill="#8B5CF6" filter="url(#neon)" />
  <circle cx="50" cy="20" r="3.5" fill="#00F0FF" filter="url(#neon)" />
  <circle cx="50" cy="44" r="3.5" fill="#38BDF8" filter="url(#neon)" />
  
  <!-- Core Pulse -->
  <circle cx="32" cy="32" r="6" fill="#070C1A" stroke="#00F0FF" stroke-width="2" />
  <circle cx="32" cy="32" r="2.5" fill="#00F0FF" />
</svg>